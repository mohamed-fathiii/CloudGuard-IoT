.mark{width:40px;height:38px;background-size:114px auto;background-position:-36.7px -41.7px}
.lock{width:306px;height:255px;background-size:419px auto;background-position:-56px -153px;max-width:100%}
#app{display:flex;height:100%}
aside{width:232px;background:var(--bg2);border-right:1px solid var(--bd);display:flex;flex-direction:column;transition:width .2s;flex:none}
aside.c{width:64px}aside.c .lbl{display:none}
.brand{display:flex;gap:10px;align-items:center;padding:16px 12px;border-bottom:1px solid var(--bd)}
.brand b{display:block;font-size:15px;letter-spacing:.02em}.brand small{color:var(--mt);font-size:12px}
nav{padding:10px 8px;flex:1}
nav a{display:flex;gap:12px;align-items:center;padding:9px 12px;border-radius:6px;color:var(--mt);text-decoration:none;margin-bottom:2px;border-left:2px solid transparent}
nav a:hover{background:var(--sf);color:var(--tx)}
nav a.on{background:var(--sf);color:var(--tx);border-left-color:var(--ac)}
nav svg,.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;flex:none}
.me{padding:12px;border-top:1px solid var(--bd);display:flex;gap:10px;align-items:center;font-size:13px}
.av{width:32px;height:32px;border-radius:50%;background:var(--sf2);display:grid;place-items:center;font-weight:600;flex:none;border:1px solid var(--bd)}
main{flex:1;min-width:0;overflow:auto;display:flex;flex-direction:column}
header{display:flex;gap:12px;align-items:center;padding:12px 24px;border-bottom:1px solid var(--bd);background:var(--bg);position:sticky;top:0;z-index:5}
header h1{font-size:17px;font-weight:600}header small{color:var(--mt);display:block;font-size:12px}
.sp{flex:1}
.search{background:var(--sf);border:1px solid var(--bd);border-radius:6px;padding:8px 12px;width:260px}
.ib{background:var(--sf);border:1px solid var(--bd);border-radius:6px;width:36px;height:36px;display:grid;place-items:center;position:relative;color:var(--mt)}
.ib:hover{color:var(--tx)}.dot{position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--crit)}
.menu{position:absolute;right:24px;top:56px;background:var(--sf);border:1px solid var(--bd);border-radius:8px;width:320px;z-index:20;box-shadow:0 8px 24px #0008}
.menu div{padding:10px 14px;border-bottom:1px solid var(--bd);font-size:13px}.menu div:last-child{border:0}.menu .h{color:var(--mt);font-size:12px}
.menu button{background:none;border:0;width:100%;text-align:left;padding:10px 14px;color:var(--tx)}.menu button:hover{background:var(--sf2)}
.demo{background:#0f2a35;border-bottom:1px solid #12465a;color:#9fe9f5;padding:6px 24px;font-size:12px}
.pg{padding:24px;max-width:1440px;width:100%}
.grid{display:grid;gap:16px}.k4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1.6fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g22{grid-template-columns:1fr 1fr}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:16px;min-width:0}
.card h3{font-size:14px;font-weight:600;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.kpi{display:flex;gap:12px}.kpi .ic{color:var(--ac);width:22px;height:22px}.kpi b{font-size:28px;font-weight:600;display:block;line-height:1.1}.kpi span{color:var(--mt);font-size:12px}
.tbl{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--mt);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--bd);white-space:nowrap;cursor:pointer;user-select:none}
td{padding:10px;border-bottom:1px solid #182a3f;white-space:nowrap}tr.r:hover td{background:var(--sf2);cursor:pointer}
.b{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:600;border:1px solid}
.LOW{color:var(--low);border-color:#2a6b4a;background:#3fb97a14}.MEDIUM{color:var(--med);border-color:#7a6418;background:#e6b42214}.HIGH{color:var(--high);border-color:#8a501a;background:#f08a2414}.CRITICAL{color:var(--crit);border-color:#8a2a2a;background:#ef444418}
.n{color:var(--mt);border-color:var(--bd)}.ok{color:var(--low);border-color:#2a6b4a}
.btn{background:var(--ac);color:#041018;border:0;border-radius:6px;padding:8px 14px;font-weight:600}.btn:hover{filter:brightness(1.1)}
.btn.s{background:transparent;color:var(--tx);border:1px solid var(--bd)}.btn.s:hover{border-color:var(--ac)}
.btn.d{background:var(--crit);color:#fff}.btn:disabled{opacity:.4;cursor:not-allowed}
.in{background:var(--bg2);border:1px solid var(--bd);border-radius:6px;padding:9px 12px;width:100%}.in:focus{border-color:var(--ac);outline:0}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}.bar .in{width:auto;min-width:130px}
.score{display:flex;align-items:center;gap:8px}.sb{width:60px;height:6px;background:var(--bg);border-radius:3px;overflow:hidden}.sb i{display:block;height:100%}
.tl{border-left:2px solid var(--bd);margin-left:6px;padding-left:16px}.tl div{position:relative;padding-bottom:14px}.tl div:before{content:"";position:absolute;left:-23px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--ac)}.tl small{color:var(--mt);display:block}
.pager{display:flex;gap:6px;align-items:center;justify-content:flex-end;margin-top:12px;color:var(--mt)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--bd);margin-bottom:16px;overflow-x:auto}.tabs button{background:none;border:0;padding:10px 14px;color:var(--mt);border-bottom:2px solid transparent;white-space:nowrap}.tabs .on{color:var(--tx);border-color:var(--ac)}
.ov{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:50;padding:16px}.md{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:22px;width:480px;max-width:100%;max-height:90vh;overflow:auto}
.warn{background:#ef44441a;border:1px solid #8a2a2a;border-radius:6px;padding:10px 12px;margin:12px 0;font-size:13px}
.note{background:#00cfe810;border:1px solid #0d5a66;border-radius:6px;padding:10px 12px;font-size:13px;color:#b9eff7}
#toasts{position:fixed;right:16px;bottom:16px;display:grid;gap:8px;z-index:99}.toast{background:var(--sf2);border:1px solid var(--bd);border-left:3px solid var(--ac);padding:10px 14px;border-radius:6px;min-width:240px}.toast.e{border-left-color:var(--crit)}
.emp{text-align:center;color:var(--mt);padding:32px}.sk{height:14px;background:linear-gradient(90deg,var(--sf2),var(--bd),var(--sf2));background-size:200%;animation:sh 1.2s infinite;border-radius:4px;margin:10px 0}@keyframes sh{to{background-position:-200%}}
.kv{display:grid;grid-template-columns:140px 1fr;gap:8px 12px;font-size:13px}.kv dt{color:var(--mt)}.kv dd{margin:0;word-break:break-word}
.rs{margin:14px 0}.rs div{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid #182a3f}
.auth{min-height:100%;display:grid;grid-template-columns:1fr 1fr}.auth .l{background:var(--bg2);border-right:1px solid var(--bd);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:32px;text-align:center}
.auth .r{display:grid;place-items:center;padding:24px}.auth .fm{width:360px;max-width:100%;display:grid;gap:14px}.auth h2{font-size:22px}
label{display:grid;gap:6px;color:var(--mt);font-size:13px}a.lk{color:var(--ac);text-decoration:none;cursor:pointer}
.tg{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #182a3f}.tg input{accent-color:var(--ac);width:18px;height:18px}
.bn{display:none}
@media(max-width:1100px){.k4{grid-template-columns:repeat(2,1fr)}.g2,.g22,.g3{grid-template-columns:1fr}aside{width:64px}aside .lbl{display:none}}
@media(max-width:720px){aside{display:none}.k4{grid-template-columns:1fr 1fr}.pg{padding:14px 14px 80px}header{padding:10px 14px}.search{display:none}.auth{grid-template-columns:1fr}.auth .l{display:none}.hm{display:none}
.bn{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0));z-index:30}.bn a{flex:1;text-align:center;color:var(--mt);font-size:11px;text-decoration:none;display:grid;justify-items:center;gap:2px}.bn a.on{color:var(--ac)}.kv{grid-template-columns:110px 1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.auth .l{gap:32px}.vp{list-style:none;padding:0;display:grid;gap:18px;text-align:left;max-width:340px}.vp b{display:block;margin-bottom:2px}.vp span{color:var(--mt);font-size:13px}.dm{color:var(--mt);font-size:12px;max-width:340px}
.auth .fm{gap:16px}.auth .btn.lg{padding:11px 14px;font-size:15px}.auth .row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}.ck{display:flex;gap:8px;align-items:center}.ck input{accent-color:var(--ac);width:16px;height:16px}
.pw{position:relative;display:block}.pw .in{padding-right:64px}.sh{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--ac);padding:6px 8px;font-size:13px}
.fe{color:#ff8a8a;min-height:0;font-size:12px}.fe:empty{display:none}.in[aria-invalid=true]{border-color:var(--crit)}
.ml{display:none;gap:10px;align-items:center}@media(max-width:720px){.ml{display:flex}}

/* ---- UX / responsive refinements ---- */
:root{--focus-ring:0 0 0 3px rgba(0,207,232,.18);--shadow:0 12px 36px rgba(0,0,0,.24)}
html{scroll-behavior:smooth}
body{min-width:320px;min-height:100dvh}
#app{min-height:100dvh}
.pg{margin-inline:auto}
.card{box-shadow:0 1px 0 rgba(255,255,255,.015)}
.card h3{gap:12px;line-height:1.4}
button,input,select{min-height:36px}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--ac);outline-offset:2px;box-shadow:var(--focus-ring)}
.btn{transition:filter .16s ease,transform .16s ease}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{filter:saturate(.45)}
.in{min-width:0}
.in::placeholder{color:#718398}
.tbl{border-radius:6px}
th[onclick]{cursor:pointer}
th:not([onclick]){cursor:default}
td{line-height:1.5}
.menu,.md{box-shadow:var(--shadow)}
.ov{overflow-y:auto}
.toast{box-shadow:var(--shadow);max-width:min(420px,calc(100vw - 32px))}
.kpi{align-items:flex-start}
.kpi>div{min-width:0}
.kpi span{display:block;line-height:1.4}
.kpi b{margin:5px 0}
.score{white-space:nowrap}
.note,.warn{line-height:1.55}
.auth .fm{max-width:420px}
.auth .l{position:relative;overflow:hidden}

function invite(){const ov=document.createElement('div');ov.className='ov';ov.innerHTML=`<div class="md"><h3>Invite user</h3><div style="display:grid;gap:12px;margin:14px 0"><label>Work email<input class="in" id="ie" type="email" placeholder="name@company.com"></label><label>Role<select class="in" id="ir">${ROLES.map(r=>`<option>${r}</option>`).join('')}</select></label></div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn s" onclick="this.closest('.ov').remove()">Cancel</button><button class="btn" onclick="const e=$('#ie').value.trim();if(!/^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$/.test(e)){toast('Enter a valid work email.',1);return}USERS.push([e.split('@')[0],e,$('#ir').value]);this.closest('.ov').remove();toast('Invitation recorded for '+e+' (demo).');go()">Send invitation</button></div></div>`;document.body.append(ov)}
const SETF={'User Management':()=>`<div class="bar" style="margin:0"><span style="color:var(--mt)">${USERS.length} users</span><div class="sp"></div><button class="btn" onclick="invite()">Invite user</button></div><div class="tbl"><table><tr><th>User</th><th>Email</th><th>Role</th></tr>${USERS.map((u,i)=>`<tr><td>${u[0]}</td><td>${u[1]}</td><td><select class="in" style="min-width:190px" ${i==0?'disabled':''} onchange="USERS[${i}][2]=this.value;toast('Role updated for ${u[0]}.')">${ROLES.map(r=>`<option ${u[2]==r?'selected':''}>${r}</option>`).join('')}</select></td></tr>`).join('')}</table></div>`,
'Device Policies':()=>`<div class="tbl"><table><tr><th>Policy</th><th>Scope</th><th>Applies to</th></tr><tr><td>Operational (per-device)</td><td>Publish/subscribe only within the device's own topic namespace</td><td>${devs.filter(d=>d.st!='Quarantined').length} devices</td></tr><tr><td>Quarantine (deny all)</td><td>Explicit deny on every action</td><td>${devs.filter(d=>d.st=='Quarantined').length} devices</td></tr></table></div><label>Response mode<select class="in"><option>Dry run</option><option>Approval for High, guarded automatic for Critical</option></select></label><label>Cooldown between actions (minutes)<input class="in" value="15"></label><div class="note">Allowlisted critical devices are never isolated automatically. Every action is reversible and audited.</div>`,
'Data Retention':()=>`<label>Security events<select class="in"><option>30 days</option><option>90 days</option><option>1 year</option></select></label><label>Incidents and response history<select class="in"><option>1 year</option><option>2 years</option></select></label><label>Evidence packages<select class="in"><option>2 years</option></select></label><div class="note">Retention is applied by the target cloud storage. The local prototype keeps sample data only.</div>`};
function settings(){return shell('Settings','Administration',`<div class="tabs">${Object.keys(SET).map(t=>`<button class="${S.tab==t?'on':''}" onclick="S.tab='${t}';go()">${t}</button>`).join('')}</div><div class="card" style="max-width:640px"><h3>${S.tab}</h3><div style="display:grid;gap:12px">${(SETF[S.tab]||(()=>SET[S.tab]))()}</div><button class="btn" style="margin-top:16px" onclick="toast('Changes saved.')">Save changes</button></div>`)}
const skel=()=>`<div class="card"><div class="sk" style="width:40%"></div><div class="sk"></div><div class="sk"></div><div class="sk" style="width:70%"></div></div>`;
function dateRange(v){if(v!='Custom range'){toast('Range set: '+v);return}const ov=document.createElement('div');ov.className='ov';ov.innerHTML=`<div class="md"><h3>Custom date range</h3><div style="display:grid;gap:12px;margin:14px 0"><label>From<input class="in" type="date" id="d1"></label><label>To<input class="in" type="date" id="d2"></label></div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn s" onclick="this.closest('.ov').remove()">Cancel</button><button class="btn" onclick="if(!$('#d1').value||!$('#d2').value||$('#d1').value>$('#d2').value){toast('Choose a valid start and end date.',1);return}toast('Range set: '+$('#d1').value+' to '+$('#d2').value);this.closest('.ov').remove()">Apply</button></div></div>`;document.body.append(ov)}
function design(){const sw=(n,c)=>`<div style="display:flex;gap:10px;align-items:center;margin:6px 0"><i style="width:28px;height:28px;border-radius:6px;background:${c};border:1px solid var(--bd)"></i><span><b>${n}</b> <small style="color:var(--mt)">${c}</small></span></div>`;
return shell('Design system','Tokens and components used across ZERO TRACE',`<div class="grid g3"><div class="card"><h3>Colors</h3>${sw('Midnight Navy','#070E19')}${sw('Dark Navy','#0B1524')}${sw('Surface','#111E2E')}${sw('Electric Cyan (accent)','#00CFE8')}${sw('Off White','#F1F4F7')}${sw('Muted Blue Gray','#91A1B2')}</div><div class="card"><h3>Severity</h3>${sw('Low 0–29','#3fb97a')}${sw('Medium 30–59','#e6b422')}${sw('High 60–79','#f08a24')}${sw('Critical 80–100','#ef4444')}<div style="margin-top:12px;display:flex;gap:6px;flex-wrap:wrap">${['LOW','MEDIUM','HIGH','CRITICAL'].map(bd).join('')}</div></div><div class="card"><h3>Type and spacing</h3><div style="font-size:17px;font-weight:600">Page title · Inter 17/600</div><div style="margin:8px 0">Body · Inter 14/400</div><small style="color:var(--mt)">Caption · Inter 12/400</small><p style="margin-top:12px;color:var(--mt)">Spacing scale: 4 · 8 · 12 · 16 · 24 · 32 px. Page grid: 4 columns on desktop, 2 on tablet and mobile. Max width 1440 px.</p></div></div>
<div class="grid g22" style="margin-top:16px"><div class="card"><h3>Buttons and inputs</h3><div class="bar"><button class="btn">Primary</button><button class="btn s">Secondary</button><button class="btn d">Destructive</button><button class="btn" disabled>Disabled</button></div><div class="bar"><input class="in" placeholder="Text input"><select class="in"><option>Dropdown</option></select></div><div class="bar"><button class="btn s" onclick="toast('Changes saved.')">Success toast</button><button class="btn s" onclick="toast('Could not reach the API. Check the connection and retry.',1)">Error toast</button></div></div>
<div class="card"><h3>Loading, empty and error states</h3>${skel()}<div class="emp" style="padding:16px">No incidents yet. New incidents appear here when events correlate.</div><div class="warn"><b>Could not load events.</b> The backend API did not respond. <a class="lk" onclick="toast('Retrying…')">Retry</a></div></div></div>`)}
function auth(k){
const t={login:['Sign in','Access the CloudGuard IoT console.','Sign in'],forgot:['Reset your password','Enter your work email and we will send a reset link.','Send reset link'],reset:['Choose a new password','Use at least 10 characters.','Update password']}[k];
const pwf=(id,lb)=>`<label>${lb}<span class="pw"><input class="in" id="${id}" type="password" autocomplete="${k=='login'?'current-password':'new-password'}"><button type="button" class="sh" onclick="const i=this.previousElementSibling;i.type=i.type=='password'?'text':'password';this.textContent=i.type=='password'?'Show':'Hide'">Show</button></span><small class="fe" id="e_${id}"></small></label>`;
const em=`<label>Work email<input class="in" id="em" type="email" autocomplete="username" placeholder="name@company.com"><small class="fe" id="e_em"></small></label>`;
const body={login:em+pwf('pw','Password')+`<div class="row"><label class="ck"><input type="checkbox"> Keep me signed in</label><a class="lk" href="#forgot">Forgot password?</a></div>`,forgot:em,reset:pwf('pw','New password')+pwf('p2','Confirm password')+`<small id="stg" style="color:var(--mt)">Strength: —</small>`}[k];
return`<main class="auth auth-single"><section class="auth-card"><div class="auth-brand"><div class="logo mark" role="img" aria-label="ZERO TRACE"></div><div class="auth-brand-copy"><b>ZERO TRACE</b><span>CloudGuard IoT</span></div></div><div class="auth-heading"><span class="auth-eyebrow"><i></i> SECURE ACCESS PORTAL</span><h2>${t[0]}</h2><p>${t[1]}</p></div><div id="af" class="fm" role="group" aria-label="${t[0]}">${body}<button class="btn lg" id="sb" type="button">${t[2]} <span aria-hidden="true">→</span></button>${k=='login'?'':'<a class="lk" href="#login" style="text-align:center">Back to sign in</a>'}</div><div class="auth-foot"><span class="auth-status"><i></i> Protected demo environment</span><span>ZERO TRACE · CloudGuard IoT</span></div></section><div class="auth-bottom">Intelligent IoT security · Complete visibility · Controlled response</div></main>`}
function wire(k){const f=$('#af');if(!f)return;
const E=(id,m)=>{const e=$('#e_'+id),x=$('#'+id);if(e)e.textContent=m||'';if(x)x.setAttribute('aria-invalid',m?'true':'false')};
const okm=v=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v);
const p=$('#pw');if(k=='reset'&&p)p.oninput=()=>{const v=p.value,n=[v.length>=10,/[A-Z]/.test(v),/[0-9]/.test(v),/[^A-Za-z0-9]/.test(v)].filter(Boolean).length;$('#stg').textContent='Strength: '+(!v?'—':n<2?'Weak':n<4?'Fair':'Strong')};
const submit=()=>{const b=$('#sb');if(!b||b.disabled)return;let bad=0;['em','pw','p2'].forEach(i=>E(i));
if(k!='reset'){const v=$('#em').value.trim();if(!v){E('em','Enter your work email.');bad=1}else if(!okm(v)){E('em','Enter a valid email, like name@company.com.');bad=1}}
if(k=='login'&&!$('#pw').value){E('pw','Enter your password.');bad=1}
if(k=='reset'){const v=$('#pw').value;if(v.length<10){E('pw','Use at least 10 characters.');bad=1}else if(v!==$('#p2').value){E('p2','Passwords do not match.');bad=1}}
if(bad){const x=f.querySelector('[aria-invalid="true"]');x&&x.focus();return}
b.disabled=true;
if(k=='login'){b.textContent='Signing in…';setTimeout(()=>{toast('Signed in');nv('overview')},700)}
else if(k=='forgot'){b.textContent='Sending…';setTimeout(()=>{f.innerHTML='<h2>Check your email</h2><p style="color:var(--mt)">If the address belongs to an account, a reset link has been sent. The link expires in 30 minutes.</p><button class="btn lg" type="button" onclick="nv(\'reset\')">Open reset link (demo)</button><a class="lk" href="#login" style="text-align:center">Back to sign in</a>'},700)}
else{b.textContent='Updating…';setTimeout(()=>{toast('Password updated. Sign in with your new password.');nv('login')},700)}};
$('#sb').onclick=submit;f.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.tagName=='INPUT'&&e.target.type!='checkbox'){e.preventDefault();submit()}});
if(window.matchMedia&&matchMedia('(pointer:fine)').matches){const a=f.querySelector('input');a&&a.focus()}}
function applyTheme(){document.documentElement.dataset.theme=S.theme;document.documentElement.style.colorScheme=S.theme;const b=document.querySelector('.theme-glyph');if(b)b.textContent=S.theme==='dark'?'☀':'☾';const t=document.querySelector('.theme-toggle');if(t){t.setAttribute('aria-label',S.theme==='dark'?'Switch to light mode':'Switch to dark mode');t.title=S.theme==='dark'?'Switch to light mode':'Switch to dark mode'}}
function toggleTheme(){S.theme=S.theme==='dark'?'light':'dark';try{localStorage.setItem('zt-theme',S.theme)}catch(e){}applyTheme()}
function go(){const h=hash().split('/'),p=h[0];S.page=['overview','devices','events','incidents','response','settings','design'].includes(p)?p:p=='device'?'devices':p=='incident'?'incidents':p;
const y=$('main')?.scrollTop;if(['login','forgot','reset'].includes(p)){R.innerHTML=auth(p);applyTheme();wire(p);return}
R.innerHTML=({overview,devices,events,incidents,response,settings,design,device:()=>device(h[1]),incident:()=>incident(h[1])}[p]||overview)();applyTheme();if(y)$('main').scrollTop=y}
addEventListener('hashchange',()=>{if(S.route===location.hash.slice(1)){return}S.route=null;S.menu=null;S.ld=1;go();setTimeout(()=>{S.ld=0;go()},350)});go();
</script></body></html>
