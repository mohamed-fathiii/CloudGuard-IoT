# ================================================================
#  nginx — CloudGuard IoT على EC2
# ================================================================
#  البنية اللي الفريق شغال بيها:
#     EC2 :80  →  nginx
#                  ├── /            → Frontend  (127.0.0.1:3100)
#                  └── /api/v1/     → Backend API (127.0.0.1:3000)
#
#  تركيش الـ API تحت نفس الأصل ده بيحل مشكلة CORS نهائياً،
#  والـ Frontend يفضل شغال بـ NEXT_PUBLIC_API_BASE_URL=/api/v1
#  (نسبي) زي ما هو في الـ repo — **من غير أي تغيير في كود الـ Frontend**.
#
#  التسطيب:
#    sudo cp cloudguard.conf /etc/nginx/sites-available/
#    sudo ln -sf /etc/nginx/sites-available/cloudguard.conf /etc/nginx/sites-enabled/
#    sudo rm -f /etc/nginx/sites-enabled/default
#    sudo nginx -t && sudo systemctl reload nginx
# ================================================================

upstream cloudguard_frontend {
    server 127.0.0.1:3100;
    keepalive 32;
}

upstream cloudguard_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # رفع الملفات مش محتاجينه دلوقتي — حاجز أمان
    client_max_body_size 2m;

    # ── أساسيات ──
    server_tokens off;

    # ── الحماية من الهيدرز ──
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # ============================================================
    #  API — لازم يكون قبل الـ Frontend
    # ============================================================
    #  ⚠️ أهم سطر في الملف: المسار بـ trailing slash هيتشال لو مش
    #  موجود في الـ location.  `location /api/v1/` + `proxy_pass .../api/v1/`
    #  فمعناها إن /api/v1/devices → /api/v1/devices (مفيش تغيير).
    location /api/ {
        proxy_pass http://cloudguard_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # مفيش caching على الـ API — الداتا لازم تكون fresh
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    # ============================================================
    #  Frontend (Next.js)
    # ============================================================
    location /_next/static/ {
        proxy_pass http://cloudguard_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # الـ static assets مضمونة الهاش في الاسم → cache طويل
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://cloudguard_frontend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket / HMR لو اشتغل في dev
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_read_timeout 60s;
    }

    # ============================================================
    #  Health للمراقبة (مش بيفضح حاجة)
    # ============================================================
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # متسمحش بالوصول لـ .env أو .git لو حصل خطأ في الترتيب
    location ~ /\.(env|git|next) {
        deny all;
        return 404;
    }
}
